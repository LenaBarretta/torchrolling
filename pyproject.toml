[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "torchrolling"
dynamic = ["version"]
description = "Pandas-style rolling and exponentially weighted statistics for PyTorch tensors, fast on GPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lena Barretta" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
keywords = [
    "pytorch", "torch", "rolling", "moving-window", "ewm", "ewma", "time-series", "gpu", "pandas",
    "triton",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/LenaBarretta/torchrolling"
Issues = "https://github.com/LenaBarretta/torchrolling/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6",
    "numpy>=1.24",
    "pandas>=2.0",
    "pandas-stubs>=2.0",
    "triton>=3.0; sys_platform == 'linux'",
    "mpmath>=1.3",
]

# Develop and test against the small CPU-only torch build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Benchmarks and notebooks live in the repository but not in the package people install.
# (The wheel only ever contains src/torchrolling; this keeps them out of the sdist too.)
[tool.hatch.build.targets.sdist]
exclude = ["bench", "notebooks", "docs", ".github"]

[tool.hatch.version]
path = "src/torchrolling/__init__.py"

[tool.pytest.ini_options]
addopts = "-q --cov=torchrolling --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
# pandas' own reference computations warn on all-missing windows with some numpy versions.
filterwarnings = ["ignore:All-NaN slice encountered:RuntimeWarning"]

[tool.coverage.run]
# Kernels only import where Triton is installed (Linux). The tests still run them there,
# on CPU through Triton's interpreter (see tests/conftest.py).
omit = ["*/torchrolling/_triton.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Kernels branch on constexprs, which Triton's compiler resolves from plain comparisons and
# if blocks; `in` tests and conditional expressions are not reliably supported there.
"src/torchrolling/_triton.py" = ["SIM108", "SIM109"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Triton and mpmath ship no type information.
module = ["triton", "triton.*", "mpmath"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torchrolling._triton"]
disallow_untyped_decorators = false
